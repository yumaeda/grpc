syntax = "proto3";

package swapi.photo;

option go_package = "github.com/yumaeda/sakabas-grpc/swapi/photo/photo;photopb";

service PhotoService {
  rpc GetPhoto(GetPhotoRequest) returns (GetPhotoResponse);
  rpc ListPhotos(ListPhotosRequest) returns (ListPhotosResponse);
}

message GetPhotoRequest {
  int64 id = 1;
}

message GetPhotoResponse {
  Photo photo = 1;
}

message ListPhotosRequest {
  string restaurant_id = 1;
}

message ListPhotosResponse {
  repeated Photo photos = 1;
}

message Photo {
  int64 id = 1;
  string restaurant_id = 2;
  string name = 3;
  string image = 4;
  string image_webp = 5;
  string thumbnail = 6;
  string thumbnail_webp = 7;
}
