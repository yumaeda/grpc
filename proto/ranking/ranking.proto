syntax = "proto3";

package ranking;

option go_package = "proto/ranking";

service RankingService {
  rpc GetRanking(GetRankingRequest) returns (GetRankingResponse);
}

message GetRankingRequest {
  int64 id = 1;
}

message GetRankingResponse {
  Ranking ranking = 1;
}

message Ranking {
  int64 id = 1;
  int64 rank = 2;
  int64 dish_id = 3;
  int64 photo_id = 4;
}
